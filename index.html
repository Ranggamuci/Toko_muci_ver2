<!-- Pustaka Swiper.js (CSS & JS CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- ================= KONTEN UTAMA ALA SHOPEE ================= -->
<main class="bg-gray-100 py-6 px-2 md:px-8">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- BANNER SLIDER PROMO BERGANTI (SWIPER.JS) -->
    <section class="bg-white rounded-sm shadow-sm overflow-hidden">
      <div class="swiper bannerSwiper w-full h-44 sm:h-64 md:h-80 relative">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/banner-promo-1.jpg" alt="Promo Diskon ATK" class="w-full h-full object-cover">
          </div>
          <div class="swiper-slide">
            <img src="images/banner-promo-2.jpg" alt="Promo Cetak & Print" class="w-full h-full object-cover">
          </div>
          <div class="swiper-slide">
            <img src="images/banner-promo-3.jpg" alt="Promo Stempel Custom" class="w-full h-full object-cover">
          </div>
        </div>
        
        <!-- Tombol Navigasi dan Titik Indikator -->
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next !text-orange-500 !w-8 !h-8 after:!text-lg font-bold"></div>
        <div class="swiper-button-prev !text-orange-500 !w-8 !h-8 after:!text-lg font-bold"></div>
      </div>
    </section>

    <!-- BAGIAN 1: FLASH SALE / REKOMENDASI -->
    <section class="bg-white p-4 rounded-sm shadow-sm">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-bold text-orange-600 uppercase tracking-wide">PROMO SPESIAL ATK</h2>
        <a href="#" class="text-xs text-orange-500 hover:underline">Lihat Semua &gt;</a>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 md:gap-3">
        <!-- Produk 1 -->
        <div class="bg-white border border-gray-100 rounded-sm shadow-sm hover:shadow-md transition overflow-hidden relative group">
          <div class="relative aspect-square">
            <span class="absolute top-0 left-0 bg-orange-600 text-white text-[10px] font-bold px-1.5 py-0.5 z-10">Star+</span>
            <span class="absolute top-0 right-0 bg-yellow-100 text-orange-600 text-[10px] font-bold px-1 py-0.5 z-10">-50%</span>
            <img src="images/fotokopi.jpg" alt="Fotokopi" class="w-full h-full object-cover">
          </div>
          <div class="p-2">
            <p class="text-xs text-gray-800 line-clamp-2 font-medium h-8">Fotokopi A4 / F4 Cepat & Jernih</p>
            <p class="text-sm font-bold text-orange-600 mt-1">Rp 250</p>
            <div class="mt-2 bg-orange-100 rounded-full h-3.5 relative overflow-hidden text-center">
              <div class="bg-orange-500 h-full w-3/4"></div>
              <span class="absolute inset-0 text-[9px] font-bold text-orange-700 leading-3">STOK TERBATAS</span>
            </div>
          </div>
        </div>

        <!-- Produk 2 sampai Produk 6 tetap sesuai kode asli -->
      </div>
    </section>

    <!-- BAGIAN 2: PRODUK TERLARIS -->
    <section class="bg-white p-4 rounded-sm shadow-sm">
      <!-- Seksi Produk Terlaris tetap sesuai kode asli -->
    </section>

  </div>
</main>

<!-- Skrip Inisialisasi Swiper -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const swiper = new Swiper('.bannerSwiper', {
      loop: true,
      autoplay: {
        delay: 3500,
        disableOnInteraction: false,
      },
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
    });
  });
</script>
